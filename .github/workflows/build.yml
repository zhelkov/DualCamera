name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        id: build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DualCamera.xcodeproj \
            -scheme DualCamera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DualCamera.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
        continue-on-error: true

      - name: Show build errors
        if: always()
        run: |
          if [ -f build.log ]; then
            {
              echo "## Build errors (xcodebuild)"
              echo '```'
              grep -E "error:" build.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p Payload
          cp -R "build/DualCamera.xcarchive/Products/Applications/DualCamera.app" Payload/
          zip -ry DualCamera.ipa Payload

      - name: Upload IPA artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DualCamera-ipa
          path: DualCamera.ipa
          retention-days: 7

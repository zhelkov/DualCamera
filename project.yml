name: DualCamera
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

targets:
  DualCamera:
    type: application
    platform: iOS
    sources:
      - DualCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DualCamera
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: '4'
        MARKETING_VERSION: '1.2.3'
        INFOPLIST_KEY_NSCameraUsageDescription: 'Для одновременной съёмки с передней и задней камер.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Для записи звука вместе с видео.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Для сохранения готовых снимков в медиатеку.'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
